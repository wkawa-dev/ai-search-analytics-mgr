[project]
name = "ai-search-analytics-mgr"
version = "0.1.0"
description = "Agent-first manager for Google Search Console + Google Analytics 4, with built-in SEO/discoverability web tools. CLI + MCP server + Claude Code plugin."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "wkawa-dev" }]
keywords = ["seo", "search-console", "google-analytics", "ga4", "mcp", "claude-code", "indexnow", "pagespeed"]
dependencies = [
  "requests>=2.31",
  "google-auth>=2.30",
  "beautifulsoup4>=4.12",
  "mcp>=2.2,<3",
  "anyio>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "responses>=0.25", "ruff>=0.6"]

[project.scripts]
asam = "asam.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asam"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905"]
